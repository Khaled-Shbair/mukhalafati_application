name: mukhalafati_application
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  #responsive design for all device
  flutter_screenutil: ^5.9.3

  #obtain Access credentials for Google services using OAuth 2.0
  googleapis_auth: ^2.0.0

  #state_management
  get: ^4.7.2

  #image
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1

  #storage data local (in device)
  shared_preferences: ^2.5.3

  #snackbar
  fluttertoast: ^8.2.12

  #dependency injection
  get_it: ^8.2.0

  #Networking
  internet_connection_checker_plus: ^2.7.2
  dartz: ^0.10.1
  json_annotation: ^4.9.0
  retrofit: ^4.4.1
  retrofit_generator: ^10.0.2
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0

  #firebase
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0
  firebase_auth: ^6.0.1

  #use to draw chart
  syncfusion_flutter_charts: ^31.1.19

  #use to draw indicator with beautiful animation
  smooth_page_indicator: ^1.2.1

  #use to draw search filed and dropdown result
  dropdown_search: ^6.0.2

  #A Dart package to convert and format `DateTime` objects into human-readable 'time ago' strings
  # like '20 seconds ago', 'a minute ago', or '7 hours ago'.
  get_time_ago: ^2.3.2

  tflite_flutter: ^0.11.0
  camera: ^0.11.2
  image: ^4.5.4

  #use to add payment
  flutter_stripe: ^12.0.2
#  flutter_stripe:
#    git:
#      url: https://github.com/flutter-stripe/flutter_stripe.git
#      path: packages/stripe
#      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


  #Required library to change icon launcher of application
  flutter_launcher_icons: ^0.14.4

  #use to change splash screen
  flutter_native_splash: ^2.4.6

  #Required libraries to deal with remote database (Api) in dev_dependencies
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

  #Approximate how your app looks and performs on another device.
  device_preview: ^1.2.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/launcher_logo.png"
  image_path_android: "assets/images/launcher_logo.png"
  image_path_ios: "assets/images/launcher_logo.png"
  adaptive_icon_foreground: "assets/images/launcher_logo.png"
  adaptive_icon_background: "#FF0000"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/driving_license_card/
    - assets/images/forgot_password/
    - assets/images/home/
    - assets/images/icons/
    - assets/images/login/
    - assets/images/logout/
    - assets/images/official_logos/
    - assets/images/on_boarding/
    - assets/images/payment/
    - assets/images/search/
    - assets/images/splash/
    - assets/json/notification_json/
    - assets/models/

  fonts:
    - family: cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-ExtraBold.ttf
          weight: 800